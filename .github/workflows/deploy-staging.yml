name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

# マイグレーション中の割り込みを避けるため、進行中のデプロイはキャンセルせずに待たせる
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Staging
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      worker-env: staging
      pages-project: chordbook-frontend-staging
      pages-branch: develop
    secrets: inherit
