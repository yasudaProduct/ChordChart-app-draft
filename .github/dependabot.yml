version: 2

# 依存パッケージと GitHub Actions の更新を自動で追従する。
#
# target-branch について:
#   PR の作成先。既定はデフォルトブランチ（main）だが、本リポジトリは
#   develop へ PR → ステージング検証 → develop→main のリリース PR という
#   運用のため develop を指定している。
#
#   ただし target-branch を指定すると Dependabot の「セキュリティ更新」
#   （脆弱性の修正 PR の自動作成）は行われなくなる点に注意。
#   これは以下で補う前提で、意図的に受け入れている:
#     - Dependabot アラート（通知）は本ファイルと無関係にリポジトリ設定側で
#       動くため、脆弱性の検知自体は引き続き行われる
#     - CI の「依存関係の脆弱性チェック」ジョブが push / PR ごとに
#       pnpm audit --prod --audit-level high を実行する
#   検知後の修正 PR は手動で develop 向けに作成する。
updates:
  # ---------------- npm / pnpm ----------------
  # pnpm ワークスペースはルートの pnpm-lock.yaml を見れば全パッケージを解決できる。
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # 開発・ビルドツールはまとめて 1 PR にして PR 数を抑える
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # 本番依存のパッチ更新もまとめる（メジャー・マイナーは個別 PR で影響を確認する）
      production-patches:
        dependency-type: production
        update-types:
          - patch

  # ---------------- GitHub Actions ----------------
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
      include: scope
