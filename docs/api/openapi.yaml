openapi: 3.0.3
info:
  title: ChordBook API
  version: "1.0.0"
  description: |
    ChordBook のバックエンド REST API 仕様（v1）。

    - 形式: JSON / UTF-8
    - 認証: Clerk JWT（一部エンドポイントは不要）
servers:
  - url: http://localhost:8080
    description: 開発（ローカル）
  - url: https://chordbook-api-staging.<account>.workers.dev
    description: ステージング
tags:
  - name: Health
    description: ヘルスチェック
  - name: Songs
    description: 楽曲（コード譜）
paths:
  /api/health:
    get:
      tags: [Health]
      summary: ヘルスチェック
      description: サーバー稼働状態を返します。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/songs:
    get:
      tags: [Songs]
      summary: 楽曲一覧取得
      description: |
        登録されている楽曲を、更新日時の降順で返します。
        ページネーションを使用します。
      parameters:
        - in: query
          name: page
          description: ページ番号（1始まり）
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - in: query
          name: limit
          description: 取得件数
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: sort
          description: ソートキー
          schema:
            type: string
            default: updatedAt
            enum: [updatedAt, title]
        - in: query
          name: order
          description: ソート順
          schema:
            type: string
            default: desc
            enum: [asc, desc]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongListResponse"

    post:
      tags: [Songs]
      summary: 楽曲作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSongRequest"
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: 作成されたリソースのURL
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/songs/demo:
    get:
      tags: [Songs]
      summary: デモ用楽曲一覧取得
      description: |
        `isDemo = true` の楽曲を更新日時の降順で返します。
        ログイン前に機能を試すためのエンドポイントで、認証は不要です。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SongListItem"

  /api/songs/artists:
    get:
      tags: [Songs]
      summary: 公開曲のアーティスト名一覧取得
      description: |
        アーティスト名入力のサジェスト（オートコンプリート）用のエンドポイントです。
        公開曲（`visibility = "public"`、`isDemo = false`）のアーティスト名を、
        表記ゆれ（大文字小文字・全角半角・空白）を正規化して重複排除し、
        登録数の多い順に最大 500 件返します。認証は不要です。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["YOASOBI", "King Gnu", "あいみょん"]

  /api/songs/{id}:
    get:
      tags: [Songs]
      summary: 楽曲詳細取得
      description: |
        指定した楽曲を取得します。
        MVPでは権限制御は行いません。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Songs]
      summary: 楽曲更新
      description: MVPでは権限制御は行いません。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSongRequest"
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Songs]
      summary: 楽曲削除
      description: MVPでは権限制御は行いません。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"

components:
  responses:
    BadRequest:
      description: Bad Request（バリデーションエラー等）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationProblemDetails"
    NotFound:
      description: Not Found（存在しない）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: healthy
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    Visibility:
      type: integer
      format: int32
      description: |
        公開設定:
        - 0: Private（作成者のみ）
        - 1: UrlOnly（URLを知っている人のみ）
        - 2: SpecificUsers（特定ユーザーのみ）
        - 3: Public（全員に公開）
      enum: [0, 1, 2, 3]

    ChordBlock:
      type: object
      required: [id, chord, offset]
      properties:
        id:
          type: string
          example: chord-1
        chord:
          type: string
          example: C
        offset:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 行内の相対位置（0〜1）
          example: 0.2

    SectionLine:
      type: object
      required: [id, lyrics, chords]
      properties:
        id:
          type: string
          example: line-1
        lyrics:
          type: string
          description: コードのみのセクションでは空文字
          example: きょうも いちにち
        chords:
          type: array
          items:
            $ref: "#/components/schemas/ChordBlock"

    SectionContent:
      type: object
      description: |
        セクションの中身。`Section.content` には**この構造を JSON 文字列化したもの**が入る
        （`Songs.Content` の中でさらに文字列としてネストする）。
      required: [lines]
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/SectionLine"

    Section:
      type: object
      required: [id, name, type, content]
      properties:
        id:
          type: string
          description: セクションID（クライアント側で生成可）
          example: section-1
        name:
          type: string
          example: イントロ
        type:
          type: string
          enum: ["lyrics-chord", "chord-only"]
          example: chord-only
        content:
          type: string
          description: SectionContent を JSON 文字列化したもの
          example: '{"lines":[{"id":"line-1","lyrics":"","chords":[{"id":"chord-1","chord":"C","offset":0.2}]}]}'
        key:
          type: string
          maxLength: 10
          description: |
            セクションのキー（任意）。未設定なら省略する（null は入れない）。
            未設定時は直前のセクション → 楽曲全体の順に継承する（carry-forward）。
          example: Am
        bpm:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
          description: セクションのテンポ（任意）。未設定時は key と同じ規則で継承する。
          example: 90
        timeSignature:
          type: string
          maxLength: 10
          description: セクションの拍子（任意）。未設定時は key と同じ規則で継承する。
          example: "6/8"

    SongContent:
      type: object
      description: |
        コード譜データ。`Songs.Content` にはこの構造を JSON 文字列化したものが格納される。
        API のレスポンスではパース済みのオブジェクトとして返り、
        更新リクエストでは JSON 文字列として送る。
      required: [sections]
      properties:
        sections:
          type: array
          items:
            $ref: "#/components/schemas/Section"

    SongListItem:
      type: object
      required: [id, title, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        artist:
          type: string
          nullable: true
          maxLength: 200
        key:
          type: string
          nullable: true
          maxLength: 10
        updatedAt:
          type: string
          format: date-time

    SongListResponse:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SongListItem"
        total:
          type: integer
          format: int32
          minimum: 0
        page:
          type: integer
          format: int32
          minimum: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
        totalPages:
          type: integer
          format: int32
          minimum: 0

    Song:
      type: object
      required:
        - id
        - title
        - content
        - visibility
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        artist:
          type: string
          nullable: true
          maxLength: 200
        key:
          type: string
          nullable: true
          maxLength: 10
        bpm:
          type: integer
          format: int32
          nullable: true
          minimum: 1
        timeSignature:
          type: string
          nullable: true
          maxLength: 10
          example: "4/4"
        content:
          $ref: "#/components/schemas/SongContent"
        visibility:
          $ref: "#/components/schemas/Visibility"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSongRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        artist:
          type: string
          nullable: true
          maxLength: 200
        key:
          type: string
          nullable: true
          maxLength: 10
        bpm:
          type: integer
          format: int32
          nullable: true
          minimum: 1
        timeSignature:
          type: string
          nullable: true
          maxLength: 10

    UpdateSongRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          maxLength: 200
        artist:
          type: string
          nullable: true
          maxLength: 200
        key:
          type: string
          nullable: true
          maxLength: 10
        bpm:
          type: integer
          format: int32
          nullable: true
          minimum: 1
        timeSignature:
          type: string
          nullable: true
          maxLength: 10
        content:
          $ref: "#/components/schemas/SongContent"

    ProblemDetails:
      type: object
      description: ASP.NET Core 標準の Problem Details（RFC 7807）
      properties:
        type:
          type: string
          example: "https://tools.ietf.org/html/rfc7231#section-6.5.1"
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true

    ValidationProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
